name: Tracker Wolfs
# Heures en UTC. Soirée de jeu 18h-00h (Paris) : surveillance toutes les 2 min.
# Le reste du temps : un passage toutes les 30 min.
on:
  schedule:
    - cron: "55 16 * * *"          # 17h55 Paris (hiver) : surveillance 1re moitié de soirée
    - cron: "55 19 * * *"          # 20h55 Paris (hiver) : surveillance 2e moitié de soirée
    - cron: "0,30 0-15,23 * * *"   # hors soirée : un passage toutes les 30 min
  workflow_dispatch:
    inputs:
      minutes:
        description: "Durée de surveillance (0 = un seul passage)"
        default: "0"
      test_discord:
        description: "Envoyer un message de test sur Discord"
        type: boolean
        default: false
concurrency:
  group: tracker
  cancel-in-progress: false
jobs:
  suivre:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - name: Reprendre l'état précédent
        uses: actions/cache/restore@v4
        with:
          path: etat.json
          key: etat-${{ github.run_id }}
          restore-keys: etat-
      - name: Suivre les matchs
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          CLE_EXTENSION: ${{ secrets.CLE_EXTENSION }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ "${{ github.event.inputs.test_discord }}" = "true" ]; then python3 tracker.py --test-discord; exit $?; fi
          MIN="${{ github.event.inputs.minutes }}"
          if [ -z "$MIN" ]; then
            case "${{ github.event.schedule }}" in
              "55 16 * * *") MIN=180 ;;
              "55 19 * * *") MIN=185 ;;
              *) MIN=0 ;;
            esac
          fi
          python3 tracker.py --boucle "$MIN"
      - name: Sauvegarder l'état
        if: always()
        uses: actions/cache/save@v4
        with:
          path: etat.json
          key: etat-${{ github.run_id }}
